<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <!-- Outer Shield Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#pulseGrad)" stroke-width="8" stroke-dasharray="280 120" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Biometric Pulse Wave -->
  <path d="M 112 256 L 180 256 L 205 160 L 235 340 L 270 200 L 295 285 L 320 256 L 400 256" fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Central Target Eye -->
  <circle cx="256" cy="256" r="28" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>
</svg>
